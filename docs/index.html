<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#09090a">
<meta name="description" content="A click-wheel music player that plays 30-second previews of the most-played songs on Apple Music.">
<title>Pod</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='8' y='2' width='32' height='44' rx='4' fill='%23e4e6ea'/%3E%3Crect x='12' y='6' width='24' height='15' fill='%231b1b1d'/%3E%3Ccircle cx='24' cy='33' r='10' fill='%23fff'/%3E%3Ccircle cx='24' cy='33' r='3.6' fill='%23d2d4d9'/%3E%3C/svg%3E">
<style>
  @font-face { font-family: Heros; font-weight: 700; src: url(fonts/heros-bold.otf) format("opentype"); }
  @font-face { font-family: Heros; font-weight: 400; src: url(fonts/heros-regular.otf) format("opentype"); }
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #09090a; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; display: block; outline: none; }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(8px + env(safe-area-inset-bottom));
    text-align: center; font: 11px/16px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #6d7075;
  }
  footer a { color: #8d9096; }
</style>
</head>
<body>
<canvas id="pod" tabindex="0" aria-label="Click-wheel music player. Use the arrow keys to scroll, Enter to select, Escape for Menu and Space to play or pause."></canvas>
<footer>Song previews courtesy of <a href="https://music.apple.com/" target="_blank" rel="noopener">Apple Music</a>
  · Unofficial fan project, not affiliated with Apple · <a href="https://github.com/fordpepper/pod" target="_blank" rel="noopener">Source &amp; Android app</a></footer>
<script src="pod.js"></script>
</body>
</html>
